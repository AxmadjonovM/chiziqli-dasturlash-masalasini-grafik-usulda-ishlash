<!DOCTYPE html>
<html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grafik usul – to'g'ri chiziqlar va yechimlar sohasi</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#fff;--fg:#1d2330;--mut:#667;--card:#f4f6fa;--bd:#d5dae3;--grid:#e4e8ef;--ax:#222;--acc:#2563eb}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171d;--fg:#e8ebf2;--mut:#9aa3b5;--card:#1d222b;--bd:#343b49;--grid:#2a303b;--ax:#ddd;--acc:#6ea0ff}}
:root[data-theme="dark"]{--bg:#14171d;--fg:#e8ebf2;--mut:#9aa3b5;--card:#1d222b;--bd:#343b49;--grid:#2a303b;--ax:#ddd;--acc:#6ea0ff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:14px;display:grid;gap:14px;grid-template-columns:minmax(0,340px) minmax(0,1fr)}
@media(max-width:800px){.wrap{grid-template-columns:1fr}}
h1{font-size:18px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px}
.row{display:flex;align-items:center;gap:4px;margin:5px 0;flex-wrap:wrap}
input[type=number]{width:54px;padding:4px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--fg)}
select,button{padding:4px 8px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--fg);cursor:pointer}
button.p{background:var(--acc);color:#fff;border-color:var(--acc)}
.dot{width:12px;height:12px;border-radius:3px;flex:none}
.eq{font-size:12px;color:var(--mut);margin:0 0 4px 16px}
#cv{width:100%;height:auto;aspect-ratio:1/1;display:block;background:var(--bg);border:1px solid var(--bd);border-radius:10px}
#res{font-size:14px;margin-top:8px}
</style></head><body>
<div class="wrap">
<div>
 <div class="card">
  <h1>Grafik usul (x₁Ox₂ tekisligi)</h1>
  <div class="row"><button onclick="preset(1)">1-variant</button><button onclick="preset(2)">2-variant</button></div>
  <b>Maqsad funksiya</b>
  <div class="row"><input id="c1" type="number" step="any" value="-3"> x₁ + <input id="c2" type="number" step="any" value="-5"> x₂ → min, max</div>
  <b>Chegaralar</b> <span style="color:var(--mut);font-size:12px">(a₁x₁ + a₂x₂ ? b)</span>
  <div id="list"></div>
  <div class="row"><button onclick="addRow()">+ Chiziq qo'shish</button><button class="p" onclick="draw()">Chizish</button></div>
 </div>
 <div class="card" style="margin-top:14px"><div id="res"></div></div>
</div>
<div><canvas id="cv" width="800" height="800"></canvas></div>
</div>
<script>
const COL=['#e6194b','#3b82f6','#16a34a','#f59e0b','#9333ea','#0891b2','#db2777','#65a30d'];
let cons=[];
const P={1:{c:[-3,-5],r:[[1,4,'<=',3],[-1,-5,'<=',3],[-2,2,'>=',-1],[0,1,'>=',0]]},
2:{c:[4,-1],r:[[2,-5,'<=',-1],[-4,4,'<=',2],[0,1,'>=',-1],[1,-4,'>=',-5]]}};
function preset(k){c1.value=P[k].c[0];c2.value=P[k].c[1];cons=P[k].r.map(r=>r.slice());render();draw()}
function render(){
 list.innerHTML='';
 cons.forEach((r,i)=>{
  const d=document.createElement('div');
  const col=COL[i%COL.length];
  d.innerHTML=`<div class="row"><span class="dot" style="background:${col}"></span>
  <input type="number" step="any" value="${r[0]}" data-i="${i}" data-j="0"> x₁ +
  <input type="number" step="any" value="${r[1]}" data-i="${i}" data-j="1"> x₂
  <select data-i="${i}" data-j="2"><option ${r[2]=='<='?'selected':''} value="<=">≤</option><option ${r[2]=='>='?'selected':''} value=">=">≥</option><option ${r[2]=='='?'selected':''} value="=">=</option></select>
  <input type="number" step="any" value="${r[3]}" data-i="${i}" data-j="3">
  <button onclick="cons.splice(${i},1);render();draw()">✕</button></div><div class="eq">${lineEq(r)}</div>`;
  list.appendChild(d);
 });
 list.querySelectorAll('input,select').forEach(e=>e.onchange=()=>{const v=e.dataset.j==2?e.value:parseFloat(e.value);cons[e.dataset.i][e.dataset.j]=v;render();draw()});
}
function f(x){return +(+x).toFixed(3)}
function lineEq(r){const[a,b,,c]=r;
 if(Math.abs(a)>1e-12){const k=-b/a,q=c/a;return `x₁ = ${f(k)}·x₂ ${q<0?'−':'+'} ${f(Math.abs(q))}`}
 return `x₂ = ${f(c/b)}`}
function addRow(){cons.push([1,1,'<=',1]);render();draw()}
function clip(poly,a,b,c){ // keep a*x+b*y<=c
 const out=[];
 for(let i=0;i<poly.length;i++){
  const p=poly[i],q=poly[(i+1)%poly.length];
  const fp=a*p[0]+b*p[1]-c,fq=a*q[0]+b*q[1]-c;
  if(fp<=1e-9)out.push(p);
  if((fp<-1e-9&&fq>1e-9)||(fp>1e-9&&fq<-1e-9)){const t=fp/(fp-fq);out.push([p[0]+t*(q[0]-p[0]),p[1]+t*(q[1]-p[1])])}
 }
 return out}
function segClip(a,b,c,V){ // line a x+b y=c within view V -> two points
 const d=[-b,a],n=a*a+b*b,p0=[a*c/n,b*c/n];let t0=-1e9,t1=1e9;
 for(const[k,lo,hi]of[[0,V.x0,V.x1],[1,V.y0,V.y1]]){
  if(Math.abs(d[k])<1e-12){if(p0[k]<lo||p0[k]>hi)return null;continue}
  let u=(lo-p0[k])/d[k],w=(hi-p0[k])/d[k];if(u>w)[u,w]=[w,u];t0=Math.max(t0,u);t1=Math.min(t1,w)}
 if(t0>t1)return null;
 return[[p0[0]+d[0]*t0,p0[1]+d[1]*t0],[p0[0]+d[0]*t1,p0[1]+d[1]*t1]]}
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()}
function draw(){
 const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),W=cv.width,H=cv.height;
 const L=cons.map(r=>{let[a,b,s,c]=r;return{a,b,s,c}});
 // view bounds from intersections
 const pts=[[0,0]];
 for(let i=0;i<L.length;i++){
  const A=L[i];
  if(Math.abs(A.a)>1e-12)pts.push([A.c/A.a,0]);if(Math.abs(A.b)>1e-12)pts.push([0,A.c/A.b]);
  for(let j=i+1;j<L.length;j++){const B=L[j],D=A.a*B.b-A.b*B.a;
   if(Math.abs(D)>1e-12)pts.push([(A.c*B.b-A.b*B.c)/D,(A.a*B.c-A.c*B.a)/D])}}
 let xs=pts.map(p=>p[0]).filter(isFinite),ys=pts.map(p=>p[1]).filter(isFinite);
 let x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
 let m=Math.max(x1-x0,y1-y0,2)*0.25+1;x0-=m;x1+=m;y0-=m;y1+=m;
 const cx=(x0+x1)/2,cy=(y0+y1)/2,R=Math.max(x1-x0,y1-y0)/2;
 const V={x0:cx-R,x1:cx+R,y0:cy-R,y1:cy+R};const S=W/(2*R);
 const X=x=>(x-V.x0)*S,Y=y=>H-(y-V.y0)*S;
 ctx.clearRect(0,0,W,H);ctx.font='15px system-ui';
 // grid
 const step=(()=>{const r=2*R/10,p=Math.pow(10,Math.floor(Math.log10(r))),n=r/p;return(n<1.5?1:n<3.5?2:n<7.5?5:10)*p})();
 ctx.lineWidth=1;ctx.strokeStyle=css('--grid');ctx.fillStyle=css('--mut');
 for(let x=Math.ceil(V.x0/step)*step;x<=V.x1;x+=step){ctx.beginPath();ctx.moveTo(X(x),0);ctx.lineTo(X(x),H);ctx.stroke();ctx.fillText(f(x),X(x)+2,Math.min(H-4,Math.max(14,Y(0)+14)))}
 for(let y=Math.ceil(V.y0/step)*step;y<=V.y1;y+=step){ctx.beginPath();ctx.moveTo(0,Y(y));ctx.lineTo(W,Y(y));ctx.stroke();if(Math.abs(y)>1e-9)ctx.fillText(f(y),Math.min(W-40,Math.max(2,X(0)+4)),Y(y)-3)}
 // axes
 ctx.strokeStyle=css('--ax');ctx.lineWidth=1.8;ctx.fillStyle=css('--ax');
 ctx.beginPath();ctx.moveTo(0,Y(0));ctx.lineTo(W,Y(0));ctx.moveTo(X(0),0);ctx.lineTo(X(0),H);ctx.stroke();
 ctx.font='bold 17px system-ui';ctx.fillText('x₁',W-30,Y(0)-8);ctx.fillText('x₂',X(0)+8,18);ctx.fillText('O',X(0)+5,Y(0)+17);
 // feasible polygon
 let poly=[[V.x0-1,V.y0-1],[V.x1+1,V.y0-1],[V.x1+1,V.y1+1],[V.x0-1,V.y1+1]];
 for(const l of L){
  if(l.s=='<=')poly=clip(poly,l.a,l.b,l.c);
  else if(l.s=='>=')poly=clip(poly,-l.a,-l.b,-l.c);
  else{poly=clip(poly,l.a,l.b,l.c);poly=clip(poly,-l.a,-l.b,-l.c)}
  if(!poly.length)break}
 const ok=poly.length>=2;
 if(ok){
  ctx.save();ctx.beginPath();poly.forEach((p,i)=>i?ctx.lineTo(X(p[0]),Y(p[1])):ctx.moveTo(X(p[0]),Y(p[1])));ctx.closePath();
  ctx.fillStyle='rgba(37,99,235,.13)';ctx.fill();ctx.clip();
  ctx.strokeStyle='rgba(37,99,235,.75)';ctx.lineWidth=1.3;
  for(let k=-H;k<W+H;k+=9){ctx.beginPath();ctx.moveTo(k,H);ctx.lineTo(k+H,0);ctx.stroke()}
  ctx.restore()}
 // lines
 L.forEach((l,i)=>{
  const col=COL[i%COL.length];ctx.strokeStyle=col;ctx.lineWidth=2.4;
  const s=segClip(l.a,l.b,l.c,V);if(!s)return;
  ctx.beginPath();ctx.moveTo(X(s[0][0]),Y(s[0][1]));ctx.lineTo(X(s[1][0]),Y(s[1][1]));ctx.stroke();
  const mx=X(s[0][0]*0.8+s[1][0]*0.2),my=Y(s[0][1]*0.8+s[1][1]*0.2);
  ctx.fillStyle=col;ctx.font='bold 15px system-ui';ctx.fillText('L'+(i+1),Math.min(W-24,Math.max(4,mx+6)),Math.min(H-6,Math.max(16,my-6)))});
 // objective
 const c=[+c1.value,+c2.value];let html='';
 if(!ok){html='<b>Yechimlar sohasi bo\'sh</b> (chiziqlar umumiy soha hosil qilmaydi).'}
 else{
  const vals=poly.map(p=>c[0]*p[0]+c[1]*p[1]);
  const onB=p=>Math.abs(p[0]-(V.x0-1))<1e-6||Math.abs(p[0]-(V.x1+1))<1e-6||Math.abs(p[1]-(V.y0-1))<1e-6||Math.abs(p[1]-(V.y1+1))<1e-6;
  const imin=vals.indexOf(Math.min(...vals)),imax=vals.indexOf(Math.max(...vals));
  const unb=poly.some(onB);
  // gradient arrow
  const g=Math.hypot(c[0],c[1])||1,gl=R*0.35;
  const ox=X(0),oy=Y(0),ex=ox+c[0]/g*gl*S,ey=oy-c[1]/g*gl*S;
  ctx.strokeStyle='#d946ef';ctx.fillStyle='#d946ef';ctx.lineWidth=2.5;
  ctx.beginPath();ctx.moveTo(ox,oy);ctx.lineTo(ex,ey);ctx.stroke();
  const an=Math.atan2(ey-oy,ex-ox);ctx.beginPath();ctx.moveTo(ex,ey);ctx.lineTo(ex-12*Math.cos(an-.4),ey-12*Math.sin(an-.4));ctx.lineTo(ex-12*Math.cos(an+.4),ey-12*Math.sin(an+.4));ctx.fill();
  ctx.font='bold 14px system-ui';ctx.fillText('c=('+c[0]+'; '+c[1]+')',ex+6,ey-6);
  const lvl=(p,col,t)=>{const s=segClip(c[0],c[1],c[0]*p[0]+c[1]*p[1],V);if(!s)return;
   ctx.setLineDash([8,6]);ctx.strokeStyle=col;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(X(s[0][0]),Y(s[0][1]));ctx.lineTo(X(s[1][0]),Y(s[1][1]));ctx.stroke();ctx.setLineDash([]);
   ctx.fillStyle=col;ctx.beginPath();ctx.arc(X(p[0]),Y(p[1]),6,0,7);ctx.fill();ctx.font='bold 14px system-ui';ctx.fillText(t,X(p[0])+9,Y(p[1])-9)};
  if(Math.hypot(...c)>0){
   lvl(poly[imin],'#16a34a','min');lvl(poly[imax],'#dc2626','max')}
  // vertices
  const seen=[];poly.forEach(p=>{if(onB(p))return;ctx.fillStyle=css('--ax');ctx.beginPath();ctx.arc(X(p[0]),Y(p[1]),3.5,0,7);ctx.fill()});
  const real=poly.filter(p=>!onB(p));
  html=`<b>Burchak nuqtalar:</b> `+real.map(p=>`(${f(p[0])}; ${f(p[1])}) → Z=${f(c[0]*p[0]+c[1]*p[1])}`).join('<br>')+'<br><br>';
  if(unb)html+='Soha <b>chegaralanmagan</b>: maqsad funksiya bir yo\'nalishda cheksiz o\'zgarishi mumkin (ko\'rinadigan oynadan tashqariga chiqadi).<br>';
  const pm=poly[imin],pM=poly[imax];
  html+=`<span style="color:#16a34a"><b>min</b></span>: ${onB(pm)?'chegaralanmagan':`Z=${f(vals[imin])} (${f(pm[0])}; ${f(pm[1])})`}<br><span style="color:#dc2626"><b>max</b></span>: ${onB(pM)?'chegaralanmagan':`Z=${f(vals[imax])} (${f(pM[0])}; ${f(pM[1])})`}`}
 res.innerHTML=html}
preset(1);
addEventListener('resize',draw);
document.getElementById('c1').onchange=document.getElementById('c2').onchange=draw;
</script></body></html>
